<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQF Pattern Report</title>
<meta name="description" content="Answer 10 simple questions about your life. Your personal Pattern Report arrives by email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#212a40;
    --navy2:#1a2235;
    --cream:#f4f0e6;
    --gold:#b99755;
    --gold2:#d8b96a;
    --line:rgba(244,240,230,.16);
    --line2:rgba(244,240,230,.3);
    --muted:rgba(244,240,230,.62);
    --warn:#e8a08a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--navy);}
  body{
    background:var(--navy);
    font-family:'DM Sans',system-ui,sans-serif;
    color:var(--cream);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:56px 24px 24px 24px;}
  .brand{text-align:center;margin-bottom:34px;}
  .brand h1{
    font-family:'Newsreader',serif;
    font-weight:500;letter-spacing:-.02em;
    font-size:clamp(44px,6.5vw,80px);line-height:.98;
    color:var(--cream);text-wrap:balance;
  }
  .brand .rule{width:56px;height:2px;background:var(--gold);margin:26px auto 0 auto;}

  /* Progress */
  .progresswrap{max-width:620px;margin:0 auto 10px auto;}
  .progressbar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progressfill{height:100%;width:0;background:var(--gold2);border-radius:2px;transition:width .4s ease;}
  .progresstext{
    text-align:center;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-top:16px;
  }

  .intro{
    font-family:'Newsreader',serif;
    font-size:clamp(19px,1.7vw,23px);line-height:1.5;
    color:rgba(244,240,230,.9);
    margin:14px auto 8px auto;
    text-align:center;
    max-width:600px;
    text-wrap:pretty;
  }
  .intro p{margin-bottom:14px;}

  /* Steps */
  .stepbody{min-height:340px;}
  .step{display:none;animation:fadein .28s ease;}
  .step.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.step{animation:none;}}

  .card{
    background:rgba(255,255,255,.035);
    border:1px solid var(--line);
    border-radius:22px;
    padding:36px 34px;
    margin:22px 0;
  }
  .qtext{
    font-family:'Newsreader',serif;
    font-weight:500;letter-spacing:-.01em;
    font-size:clamp(27px,3.2vw,38px);line-height:1.22;
    color:var(--cream);text-wrap:balance;
    margin-bottom:28px;
  }
  label.opt{
    display:flex;align-items:flex-start;gap:14px;
    padding:17px 20px;border:1px solid var(--line2);
    border-radius:16px;margin-bottom:12px;cursor:pointer;
    font-size:17.5px;line-height:1.45;color:rgba(244,240,230,.92);
    transition:border-color .15s, background .15s;
  }
  label.opt:hover{border-color:var(--gold2);}
  label.opt input{margin-top:4px;accent-color:var(--gold2);flex-shrink:0;width:18px;height:18px;}
  label.opt.selected{border-color:var(--gold2);background:rgba(216,185,106,.12);}
  label.opt:focus-within{border-color:var(--gold2);}
  input[type=text],input[type=email]{
    width:100%;padding:16px 18px;font-size:17.5px;
    font-family:'DM Sans',system-ui,sans-serif;color:var(--cream);
    border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.05);
    -webkit-appearance:none;appearance:none;
  }
  input::placeholder{color:rgba(244,240,230,.42);}
  input[type=text]:focus,input[type=email]:focus{outline:none;border-color:var(--gold2);background:rgba(255,255,255,.07);}
  .card.missing{border-color:var(--warn);}
  .missing-note{color:var(--warn);font-size:14px;margin-top:10px;display:none;}
  .card.missing .missing-note{display:block;}
  .consent label.opt{margin-bottom:0;font-size:15.5px;color:var(--muted);}
  .consent label.opt input{accent-color:var(--gold2);}

  /* Navigation */
  .nav{display:flex;gap:14px;align-items:center;margin-top:26px;}
  button.next{
    flex:1;
    background:var(--cream);color:var(--navy);
    font-family:'DM Sans',system-ui,sans-serif;
    font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    border:none;border-radius:999px;
    padding:20px;cursor:pointer;transition:background .15s,opacity .15s;
  }
  button.next:hover{background:#fff;}
  button.next:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;}
  button.next:disabled{opacity:.55;cursor:default;}
  button.back{
    background:transparent;border:1px solid var(--line2);
    color:var(--muted);
    font-family:'DM Sans',system-ui,sans-serif;
    font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    border-radius:999px;padding:18px 26px;cursor:pointer;transition:border-color .15s,color .15s;
  }
  button.back:hover{border-color:var(--gold2);color:var(--cream);}
  button.back.hidden{display:none;}
  button.next.hidden{display:none;}

  .fineprint{
    text-align:center;font-size:13.5px;color:var(--muted);
    margin-top:20px;
  }
  .pagefoot{
    text-align:center;margin-top:44px;
    font-size:12.5px;color:rgba(244,240,230,.5);letter-spacing:.02em;
  }
  .pagefoot a{color:rgba(244,240,230,.5);}

  /* Success state */
  #success{display:none;text-align:center;padding:10px;}
  #success .rule{width:56px;height:2px;background:var(--gold);margin:30px auto;}
  #success h2{
    font-family:'Newsreader',serif;font-weight:500;letter-spacing:-.02em;
    font-size:clamp(36px,5vw,60px);line-height:1.02;color:var(--cream);
    text-wrap:balance;margin-bottom:16px;
  }
  #success p{font-family:'Newsreader',serif;font-size:21px;line-height:1.5;color:rgba(244,240,230,.9);max-width:460px;margin:0 auto 12px auto;}
  #success p.small{font-family:'DM Sans',system-ui,sans-serif;font-size:14.5px;color:var(--muted);}
  @media (max-width:560px){
    .wrap{padding:40px 18px 56px 18px;}
    .brand{margin-bottom:26px;}
    .card{padding:26px 20px;border-radius:18px;margin:18px 0;}
    .qtext{margin-bottom:22px;}
    label.opt{padding:15px 16px;font-size:16.5px;}
    input[type=text],input[type=email]{font-size:16.5px;}
    button.back{padding:18px 18px;}
  }
  .intro{color:var(--gold2);font-style:italic;}
  .hint{font-size:13.5px;line-height:1.45;color:var(--muted);margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Pattern Report</h1>
    <div class="rule"></div>
  </div>
  <div id="formview">
    <div class="progresswrap">
      <div class="progressbar"><div class="progressfill" id="progressfill"></div></div>
      <div class="progresstext" id="progresstext">1 of 10</div>
    </div>

    <form id="prform" autocomplete="on" novalidate>
      <div class="stepbody">
        <!-- QUESTION 1 -->
        <section class="step active">
          <div class="intro">
